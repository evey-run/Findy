name: Release macOS

# Déclenché sur un tag vX.Y.Z  →  git tag v1.0.0 && git push --tags
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  # ─── 2a. Build arm64 (Apple Silicon M1/M2/M3/M4) ──────────────────────────
  build-arm64:
    name: Build arm64 (Apple Silicon)
    runs-on: macos-14
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      # Paire de clés régénérée le 2026-08-21, sans mot de passe : le mot de
      # passe de la précédente était perdu, et une clé chiffrée dont personne
      # ne détient le secret ne signe plus rien. La variable doit tout de même
      # exister, sinon le bundler refuse de signer.
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate
        env:
          DATABASE_URL: "file:/tmp/build.db"

      - name: Compiler le serveur (Bun)
        run: bash scripts/build-server.sh

      - name: Build frontend
        run: npm run build

      - name: Build Tauri (arm64)
        # `bundle_dmg.sh` échoue par intermittence sur les runners macOS :
        # hdiutil et Finder travaillent mal en session sans interface. Le même
        # runner a produit ce DMG sans broncher au build précédent. Une
        # seconde tentative suffit ; deux échecs d'affilée restent une erreur.
        run: |
          npm run tauri build || {
            echo "::warning::Bundling échoué, nouvelle tentative dans 20 s"
            sleep 20
            npm run tauri build
          }

      # L'updater macOS ne consomme pas le DMG mais l'archive `.app.tar.gz`.
      # Les deux architectures produisent le même nom de fichier, d'où le
      # suffixe. Tout est rassemblé à plat dans dist-release/ : `upload-artifact`
      # conserve l'arborescence commune, et un `bundle/dmg/…` imbriqué ferait
      # échouer les globs du job de publication.
      - name: Préparer les artefacts arm64
        run: |
          set -euo pipefail
          cd src-tauri/target/release/bundle/macos
          mv Findy.app.tar.gz Findy_aarch64.app.tar.gz
          mv Findy.app.tar.gz.sig Findy_aarch64.app.tar.gz.sig
          cd "$GITHUB_WORKSPACE"
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/dmg/*.dmg dist-release/
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz dist-release/
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz.sig dist-release/
          ls -l dist-release/

      # Les artefacts transitent par le stockage du workflow : rien n'est
      # publié tant que les DEUX architectures et le manifeste ne sont pas
      # prêts (voir le job « release »).
      - name: Publier les artefacts arm64 dans le workflow
        uses: actions/upload-artifact@v4
        with:
          name: bundles-arm64
          if-no-files-found: error
          retention-days: 1
          path: dist-release/*

  # ─── 2b. Build x64 (Intel) ─────────────────────────────────────────────────
  build-x64:
    name: Build x64 (Intel)
    # macos-13 a été retiré en décembre 2025 : le job restait en file
    # d'attente indéfiniment, ce qui bloquait `generate-updater-json` et
    # laissait chaque release sans DMG Intel ni latest.json.
    # `macos-15-intel` est le dernier runner x86_64 (supporté jusqu'à
    # l'automne 2027).
    runs-on: macos-15-intel
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      # Paire de clés régénérée le 2026-08-21, sans mot de passe : le mot de
      # passe de la précédente était perdu, et une clé chiffrée dont personne
      # ne détient le secret ne signe plus rien. La variable doit tout de même
      # exister, sinon le bundler refuse de signer.
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate
        env:
          DATABASE_URL: "file:/tmp/build.db"

      - name: Compiler le serveur (Bun)
        run: bash scripts/build-server.sh

      - name: Build frontend
        run: npm run build

      - name: Build Tauri (x64)
        # `bundle_dmg.sh` échoue par intermittence sur les runners macOS :
        # hdiutil et Finder travaillent mal en session sans interface. Le même
        # runner a produit ce DMG sans broncher au build précédent. Une
        # seconde tentative suffit ; deux échecs d'affilée restent une erreur.
        run: |
          npm run tauri build || {
            echo "::warning::Bundling échoué, nouvelle tentative dans 20 s"
            sleep 20
            npm run tauri build
          }

      # L'updater macOS ne consomme pas le DMG mais l'archive `.app.tar.gz`.
      # Les deux architectures produisent le même nom de fichier, d'où le
      # suffixe. Tout est rassemblé à plat dans dist-release/ : `upload-artifact`
      # conserve l'arborescence commune, et un `bundle/dmg/…` imbriqué ferait
      # échouer les globs du job de publication.
      - name: Préparer les artefacts x64
        run: |
          set -euo pipefail
          cd src-tauri/target/release/bundle/macos
          mv Findy.app.tar.gz Findy_x64.app.tar.gz
          mv Findy.app.tar.gz.sig Findy_x64.app.tar.gz.sig
          cd "$GITHUB_WORKSPACE"
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/dmg/*.dmg dist-release/
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz dist-release/
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz.sig dist-release/
          ls -l dist-release/

      # Les artefacts transitent par le stockage du workflow : rien n'est
      # publié tant que les DEUX architectures et le manifeste ne sont pas
      # prêts (voir le job « release »).
      - name: Publier les artefacts x64 dans le workflow
        uses: actions/upload-artifact@v4
        with:
          name: bundles-x64
          if-no-files-found: error
          retention-days: 1
          path: dist-release/*

  # ─── 3. Publier la release complète ───────────────────────────────────────
  # La release n'est créée qu'ici, avec TOUS ses fichiers d'un coup. Elle était
  # auparavant publiée vide au tout début : pendant les ~10 minutes de build,
  # `releases/latest/download/latest.json` répondait 404 à tous les utilisateurs,
  # et un build raté laissait durablement « latest » sur une release sans
  # manifeste — donc plus aucune mise à jour possible pour personne.
  release:
    name: Publier la release
    runs-on: ubuntu-latest
    needs: [build-arm64, build-x64]

    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les bundles des deux architectures
        uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: assets

      - name: Generate latest.json
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          TAG="${GITHUB_REF_NAME}"

          ls -l assets/

          ARM64_ARCHIVE=$(ls assets/*_aarch64.app.tar.gz 2>/dev/null | head -1 || true)
          X64_ARCHIVE=$(ls assets/*_x64.app.tar.gz 2>/dev/null | head -1 || true)
          ARM64_SIG=$(ls assets/*_aarch64.app.tar.gz.sig 2>/dev/null | head -1 || true)
          X64_SIG=$(ls assets/*_x64.app.tar.gz.sig 2>/dev/null | head -1 || true)

          # Une plateforme manquante rendrait la mise à jour silencieusement
          # impossible pour la moitié des utilisateurs : on préfère échouer.
          for f in "$ARM64_ARCHIVE" "$X64_ARCHIVE" "$ARM64_SIG" "$X64_SIG"; do
            if [ -z "$f" ]; then
              echo "::error::Artefact d'update manquant. Contenu de assets/ :"
              ls -l assets/
              exit 1
            fi
          done

          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          python3 - "$VERSION" "$PUB_DATE" "$BASE_URL" \
            "$(basename "$ARM64_ARCHIVE")" "$(cat "$ARM64_SIG")" \
            "$(basename "$X64_ARCHIVE")" "$(cat "$X64_SIG")" <<'PYEOF' > assets/latest.json
          import json, sys
          version, pub_date, base, arm_name, arm_sig, x64_name, x64_sig = sys.argv[1:8]
          json.dump({
              "version": version,
              "notes": f"Mise à jour vers la version {version}",
              "pub_date": pub_date,
              "platforms": {
                  "darwin-aarch64": {"url": f"{base}/{arm_name}", "signature": arm_sig},
                  "darwin-x86_64": {"url": f"{base}/{x64_name}", "signature": x64_sig},
              },
          }, sys.stdout, indent=2, ensure_ascii=False)
          PYEOF

          echo "=== latest.json ==="
          cat assets/latest.json

      - name: Créer la release GitHub avec tous ses fichiers
        uses: softprops/action-gh-release@v2
        with:
          name: "Findy ${{ github.ref_name }}"
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            ## Findy ${{ github.ref_name }}

            ### Téléchargement
            | Fichier | Architecture |
            |---------|-------------|
            | `Findy_*_aarch64.dmg` | Apple Silicon (M1/M2/M3/M4) |
            | `Findy_*_x64.dmg` | Intel Mac |

            ### Mise à jour automatique
            Depuis l'application, allez dans **Paramètres → Mises à jour** et cliquez sur **Vérifier**.
            L'application téléchargera et installera la mise à jour automatiquement.

            ### Installation manuelle
            1. Ouvrir le `.dmg` correspondant à ton Mac
            2. Glisser **Findy.app** dans `/Applications` — l'app doit être lancée
               depuis `/Applications`, pas depuis le volume monté, sinon les mises
               à jour suivantes échoueront
            3. **Contourner Gatekeeper** (app non signée) — une seule fois, APRÈS
               la copie :
               ```bash
               xattr -rd com.apple.quarantine /Applications/Findy.app
               ```
               ou double-cliquer sur **`fix-quarantine.command`** ci-joint.

            ### Données persistantes
            Base de données et images stockées dans :
            `~/Library/Application Support/com.evey.finance/`
          files: |
            assets/*.dmg
            assets/*.app.tar.gz
            assets/*.app.tar.gz.sig
            assets/latest.json
            scripts/fix-quarantine.command
